<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FnDesk Theme - File Browser</title>
  <link rel="sitemap" type="application/xml" title="Sitemap" href="./sitemap.xml">
  <link rel="preload" href="./theme.json" as="fetch" crossorigin>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #1a1b2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-bar {
      background: #252640;
      border-bottom: 1px solid #333350;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .top-bar .logo {
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .top-bar .breadcrumb {
      color: #aaa;
      font-size: 0.9rem;
    }
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background: #202030;
      border-right: 1px solid #333350;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 12px 16px;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #888;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .folder-item {
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ccc;
      transition: background 0.15s;
      border-left: 3px solid transparent;
    }
    .folder-item:hover {
      background: #2a2b3d;
    }
    .folder-item.active {
      background: #2a2b3d;
      border-left-color: #5b8cff;
      color: #fff;
      font-weight: 500;
    }
    .folder-item .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.8;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: #888;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    .file-list {
      background: #252640;
      border: 1px solid #333350;
      border-radius: 8px;
      overflow: hidden;
    }
    .file-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #333350;
      transition: background 0.15s;
      cursor: pointer;
      gap: 12px;
    }
    .file-row:last-child {
      border-bottom: none;
    }
    .file-row:hover {
      background: #2a2b3d;
    }
    .file-row .file-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .file-icon.video {
      background: #3d2a5c;
      color: #b388ff;
    }
    .file-icon.image {
      background: #2a4a3d;
      color: #69f0ae;
    }
    .file-icon.json {
      background: #4a3a2a;
      color: #ffb74d;
    }
    .file-icon.svg {
      background: #2a3d4a;
      color: #64b5f6;
    }
    .file-icon.png {
      background: #4a2a3d;
      color: #ff80ab;
    }
    .file-info {
      flex: 1;
      min-width: 0;
    }
    .file-name {
      font-weight: 500;
      color: #e0e0e0;
      font-size: 0.95rem;
    }
    .file-meta {
      font-size: 0.8rem;
      color: #888;
      margin-top: 2px;
    }
    .file-size {
      color: #aaa;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-content {
      background: #252640;
      border: 1px solid #444;
      border-radius: 12px;
      max-width: 90vw;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #333350;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      font-weight: 600;
      color: #fff;
    }
    .modal-close {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }
    .modal-close:hover {
      color: #fff;
    }
    .modal-body {
      padding: 0;
      background: #000;
    }
    .modal-body video {
      max-width: 90vw;
      max-height: 80vh;
      display: block;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="logo">📁 FnDesk Theme</div>
    <div class="breadcrumb" id="breadcrumb">/</div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"></div>
  </div>

  <div class="modal-overlay" id="videoModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Video</div>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <video id="modalVideo" controls autoplay></video>
      </div>
    </div>
  </div>

  <script>
    const folders = [
      { name: "牛牛伊冯" },
      { name: "牛牛余烬" },
      { name: "牛牛佩丽卡" },
      { name: "牛牛别礼" },
      { name: "牛牛卡契尔" },
      { name: "牛牛卡缪" },
      { name: "牛牛埃特拉" },
      { name: "牛牛大潘" },
      { name: "牛牛安塔尔" },
      { name: "牛牛庄方宜" },
      { name: "牛牛弧光" },
      { name: "牛牛弭弗" },
      { name: "牛牛昼雪" },
      { name: "牛牛汤汤" },
      { name: "牛牛洁尔佩塔" },
      { name: "牛牛洛茜" },
      { name: "牛牛狼卫" },
      { name: "牛牛秋栗" },
      { name: "牛牛管理员-男" },
      { name: "牛牛管理员-女" },
      { name: "牛牛艾尔黛拉" },
      { name: "牛牛艾维文娜" },
      { name: "牛牛莱万汀" },
      { name: "牛牛萤石" },
      { name: "牛牛赛希" },
      { name: "牛牛阿列什" },
      { name: "牛牛陈" },
      { name: "牛牛骏卫" },
      { name: "牛牛黎风" },
      { name: "牛牛梨诺主题" }
    ];

    const sidebar = document.getElementById("sidebar");
    const content = document.getElementById("content");
    const breadcrumb = document.getElementById("breadcrumb");
    const modal = document.getElementById("videoModal");
    const modalVideo = document.getElementById("modalVideo");
    const modalTitle = document.getElementById("modalTitle");
    const modalClose = document.getElementById("modalClose");

    function formatSize(bytes) {
      if (bytes === 0) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
    }

    function getFileInfo(fileName, size) {
      const ext = fileName.split(".").pop().toLowerCase();
      let icon = "📄";
      let type = "unknown";
      if (["mp4", "webm", "mov"].includes(ext)) { icon = "🎬"; type = "video"; }
      else if (["webp", "jpg", "jpeg", "png", "gif", "svg"].includes(ext)) { icon = "🖼️"; type = "image"; }
      else if (ext === "json") { icon = "📋"; type = "json"; }
      else if (ext === "svg") { icon = "🎨"; type = "svg"; }
      else if (ext === "png") { icon = "🖼️"; type = "png"; }
      return { icon, type, ext };
    }

    function renderSidebar() {
      sidebar.innerHTML = '<div class="sidebar-header">Folders</div>';
      folders.forEach(f => {
        const div = document.createElement("div");
        div.className = "folder-item";
        div.dataset.folder = f.name;
        div.innerHTML = `
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span>${f.name}</span>
        `;
        div.addEventListener("click", () => selectFolder(f.name));
        sidebar.appendChild(div);
      });
    }

    async function selectFolder(folderName) {
      document.querySelectorAll(".folder-item").forEach(el => {
        el.classList.toggle("active", el.dataset.folder === folderName);
      });
      breadcrumb.textContent = "/ " + folderName;

      const folder = folders.find(f => f.name === folderName);
      if (!folder) return;

      // Show loading state immediately
      content.innerHTML = `
        <div class="empty-state">
          <div class="icon">⏳</div>
          <div>Loading...</div>
        </div>
      `;

      const files = [];
      const possibleFiles = [
        "wallpaper.mp4",
        "thumbnail.webp",
        "loginBg.mp4",
        "loginLogo.png",
        "theme.json",
        "deviceLogo.svg",
        "favicon.png",
        "download.png"
      ];

      // Check which files exist
      const promises = possibleFiles.map(async (fileName) => {
        const path = `./${encodeURIComponent(folderName)}/${fileName}`;
        try {
          const res = await fetch(path, { method: "HEAD" });
          if (res.ok) {
            const size = parseInt(res.headers.get("content-length") || "0");
            return { name: fileName, size, path };
          }
        } catch (e) {
          // ignore
        }
        return null;
      });

      const results = await Promise.all(promises);
      results.forEach(file => {
        if (file) files.push(file);
      });

      content.innerHTML = "";

      if (files.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <div>Empty folder</div>
          </div>
        `;
        return;
      }

      const title = document.createElement("div");
      title.className = "section-title";
      title.textContent = `${files.length} item${files.length > 1 ? "s" : ""}`;
      content.appendChild(title);

      const list = document.createElement("div");
      list.className = "file-list";

      files.forEach(file => {
        const info = getFileInfo(file.name, file.size);
        const row = document.createElement("div");
        row.className = "file-row";
        row.innerHTML = `
          <div class="file-icon ${info.type}">${info.icon}</div>
          <div class="file-info">
            <div class="file-name">${file.name}</div>
            <div class="file-meta">${info.ext.toUpperCase()}${file.size > 0 ? " · " + formatSize(file.size) : ""}</div>
          </div>
          <div class="file-size">${file.size > 0 ? formatSize(file.size) : "—"}</div>
        `;
        row.addEventListener("click", () => {
          if (file.name.endsWith(".mp4") || file.name.endsWith(".webm") || file.name.endsWith(".mov")) {
            openVideo(file.path, file.name);
          } else {
            window.open(file.path, "_blank");
          }
        });
        list.appendChild(row);
      });

      content.appendChild(list);
    }

    function openVideo(path, name) {
      modalTitle.textContent = name;
      modalVideo.src = path;
      modal.classList.add("open");
      modalVideo.play().catch(() => {});
    }

    modalClose.addEventListener("click", () => {
      modal.classList.remove("open");
      modalVideo.pause();
      modalVideo.src = "";
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.classList.remove("open");
        modalVideo.pause();
        modalVideo.src = "";
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.classList.contains("open")) {
        modal.classList.remove("open");
        modalVideo.pause();
        modalVideo.src = "";
      }
    });

    renderSidebar();
    selectFolder("牛牛伊冯");
  </script>
</body>
</html>
